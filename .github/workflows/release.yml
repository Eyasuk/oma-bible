# Builds both apps and attaches them to a draft GitHub release whenever a
# version tag (v0.1.1, v0.2.0, ...) is pushed: one download for the desktop
# app and one for the terminal app, each with a checksum. Review the draft's
# notes on GitHub, then press Publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    # The oldest supported Ubuntu, so the binaries' glibc requirement stays
    # low enough for most distributions, not just Arch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libx11-xcb-dev libwayland-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p oma-bible-gpui -p oma-bible-tui

      - name: Package
        run: packaging/package.sh "${GITHUB_REF_NAME#v}" dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
