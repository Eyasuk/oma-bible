# Builds both apps and attaches them to a draft GitHub release whenever a
# version tag (v0.1.0, v0.2.0, ...) is pushed. Review the draft's notes on
# GitHub, then press Publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    # The oldest supported Ubuntu, so the binaries' glibc requirement stays
    # low enough for most distributions, not just Arch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libx11-xcb-dev libwayland-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p oma-bible-gpui -p oma-bible-tui

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="oma-bible-${version}-x86_64-linux"
          mkdir "$name"
          cp target/release/oma-bible target/release/oma-bible-tui "$name/"
          cp packaging/oma-bible.desktop packaging/oma-bible-tui.desktop \
             packaging/install.sh README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}.tar.gz
            ${{ env.ASSET }}.tar.gz.sha256
