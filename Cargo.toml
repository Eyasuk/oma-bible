[workspace]
members = ["crates/core", "crates/tui", "crates/gpui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
oma-bible-core = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
textwrap = "0.16.4"
unicode-bidi = "0.3.18"
unicode-width = "0.2.3"
gpui-kit = "0.9.0"
